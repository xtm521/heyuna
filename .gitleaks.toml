title = "Heyuna secret scanning — defaults plus verified public build hashes"

[extend]
useDefault = true

[[allowlists]]
description = "Exact public source SHA256 values in the desktop build evidence; api/tokens filenames are not credentials"
regexTarget = "line"
regexes = [
  '''"apps/desktop/src/api\.ts": "99e7bc2ee8f9e678727da264d6a3fffcbd1e09932dd812fa7b4719e22756490b"''',
  '''"packages/design-tokens/tokens\.css": "0d9b68efe5974ff7a463aa86f7537b96c70bf91ac467b4e4c9ac5318a7eedb6d"''',
]
