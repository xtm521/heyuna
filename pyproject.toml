[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heyuna"
version = "0.1.0"
description = "Heyuna: community AI training and verifiable contribution rewards (testnet alpha)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "numpy>=2,<3", "httpx>=0.27,<1", "safetensors>=0.4,<1", "huggingface-hub>=0.34,<2", "psutil>=6,<8", "pydantic>=2.10,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4"]

[project.optional-dependencies]
mac = ["mlx-lm>=0.29,<0.31; sys_platform == 'darwin'"]
cuda = ["torch>=2.7,<3", "transformers>=5,<6", "peft>=0.17,<1", "accelerate>=1.9,<2"]
test = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
heyuna = "heyuna.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
