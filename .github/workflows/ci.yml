name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.5
      - run: uv sync --frozen --extra test
      - run: uv run --frozen --extra test python -m pytest -q
      - run: uv run --frozen --extra test python scripts/security_scan.py

  frontend-contracts:
    name: Frontend and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test:desktop && pnpm build
      - run: pnpm audit --audit-level=high
      - run: pnpm -C contracts install --frozen-lockfile --ignore-scripts
      - run: pnpm -C contracts check
      - run: pnpm -C contracts audit --audit-level=high
      - run: pnpm -C apps/wallet install --frozen-lockfile --ignore-scripts
      - run: pnpm -C apps/wallet check
      - run: pnpm -C apps/wallet audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify and run Gitleaks
        run: |
          curl --fail --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks git --redact --no-banner .

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - run: cargo +1.99.1 build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  source-provenance:
    name: Source provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend-contracts, native, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          mkdir -p release
          git archive --format=tar.gz --output=release/heyuna-source.tar.gz HEAD
          cp uv.lock pnpm-lock.yaml release/
          cp contracts/pnpm-lock.yaml release/contracts-pnpm-lock.yaml
          cp apps/wallet/pnpm-lock.yaml release/wallet-pnpm-lock.yaml
          cp apps/desktop/src-tauri/Cargo.lock release/Cargo.lock
          cp chain/go.mod release/chain-go.mod
          cp chain/go.sum release/chain-go.sum
          python3 scripts/release_inventory.py release
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release/heyuna-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-and-dependency-locks
          path: release/
          retention-days: 30
